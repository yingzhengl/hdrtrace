[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yingzhengl-hdrtrace"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出API 响应头的可观测性上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "yingzhengl" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://yingzhengl.github.io"
Repository = "https://github.com/yingzhengl/hdrtrace"
Issues = "https://github.com/yingzhengl/hdrtrace/issues"

[project.scripts]
hdrtrace = "hdrtrace:main"

[tool.setuptools]
py-modules = ["hdrtrace"]
